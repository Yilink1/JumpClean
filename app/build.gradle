plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.yilink.jumpclean'
    compileSdk 34

    defaultConfig {
        applicationId "com.yilink.jumpclean"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "1.4.0"

        // 保留 arm64-v8a，兼顾体积与性能
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        debug {
            if (file('debug.keystore').exists()) {
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        release {
            // 👇 核心改动：开启混淆和资源压缩
            minifyEnabled true
            shrinkResources true

            // 👇 引入默认优化规则，并加载我们自己的保命规则
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // 如果没配正式签名，这里临时用 debug 签名（实验用）
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    compileOnly files('libs/XposedBridgeApi-82.jar')
    implementation 'com.github.QWEA0:liquidglass:v2.0.11'
}