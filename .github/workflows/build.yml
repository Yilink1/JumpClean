name: Build CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore Debug Keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > app/debug.keystore
          fi

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK and Prepare Artifact Name
        id: prepare_artifact
        run: |
          VERSION_NAME=$(grep "versionName" app/build.gradle | head -1 | awk -F '"' '{print $2}')
          BUILD_DATE=$(TZ='Asia/Shanghai' date +'%Y%m%d')
          APK_BASENAME="JumpClean-v${VERSION_NAME}-${BUILD_DATE}-r${{ github.run_number }}"
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${APK_BASENAME}.apk"
          echo "artifact_name=${APK_BASENAME}" >> $GITHUB_OUTPUT

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_artifact.outputs.artifact_name }}
          path: app/build/outputs/apk/debug/*.apk
